# Curated DOSBox-Staging configuration for Dungeon Hack+
# Optimized for: sharp integer scaling, aspect correction (4:3), authentic audio (SB16 + MPU-401),
# smooth 25,000 CPU cycles, and seamless mouse capture.

[sdl]
window_size         = 1280x960
aspect              = on
vsync               = on

[render]
aspect_ratio        = 4:3
integer_scaling     = auto
viewport_resolution = fit
# 'sharp' preserves crisp 320x200 pixel art without blur.
# Change to 'crt-auto' or 'crt-easymode' for nostalgic phosphor scanlines.
shader              = sharp

[cpu]
core                = auto
cputype             = 486_slow
# 25,000 cycles prevents timer race conditions in MAZE.EXE and keeps walking pace smooth.
cycles              = 25000

[mouse]
mouse_capture       = on_click
mouse_middle_click  = release

[mixer]
rate                = 48000
blocksize           = 512

[sblaster]
sbtype              = sb16
sbbase              = 220
irq                 = 7
dma                 = 1
hdma                = 5
sbmixer             = on
oplmode             = opl3

[midi]
mididevice          = auto
mpu401              = intelligent

[dos]
xms                 = on
ems                 = on
umb                 = on
